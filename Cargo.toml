[package]
name = "dnsseedrs"
version = "0.2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-compression = { version = "0.4.35", features = ["gzip", "tokio"] }
base32ct = { version = "0.2.0", features = ["alloc"] }
base64ct = { version = "~1.6.0", features = ["alloc"] }
bip324 = { version = "0.11.1", features = ["tokio"] }
bitcoin = { git = "https://github.com/rust-bitcoin/rust-bitcoin", rev = "94c6f7917fd4376ef3aae4037e5064b0ec599d1e", default-features = false }
p2p = { package = "bitcoin-p2p-messages", git = "https://github.com/rust-bitcoin/rust-bitcoin", rev = "94c6f7917fd4376ef3aae4037e5064b0ec599d1e" }
clap = { version = "4.5.1", features = ["derive"] }
domain = { version = "0.10.1", features = ["sign"] }
rand = "0.8.5"
ring = "0.17.8"
rusqlite = "0.31.0"
sha3 = "0.10.8"
tar = "0.4.40"
tokio = { version = "1.37.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
